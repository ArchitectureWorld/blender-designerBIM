name: Source checks
on:
  push:
    branches: [main]
    paths: ['designer_bim_p01/**', 'scripts/**', 'tests/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pytest>=8,<9'
      - run: python -m pytest -q
      - run: python -m compileall -q designer_bim_p01 scripts tests
      - run: python scripts/build_release.py --out dist
