name: Component source snapshot
on:
  push:
    branches: [codex/p01-component-encapsulation-v0.3.0]
    paths: ['.github/workflows/component-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 49f81260bff59bd7c824f8cc638bbc1e61274576
          persist-credentials: false
      - name: Archive tracked public source only
        run: |
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/designerbim-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/base-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: component-base-source
          path: |
            ${{ runner.temp }}/designerbim-source.tar.gz
            ${{ runner.temp }}/base-sha.txt
          retention-days: 7
