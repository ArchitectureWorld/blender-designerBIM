name: Repair component runtime tests
on:
  push:
    branches: [codex/p01-component-encapsulation-v0.3.0]
    paths: ['.github/workflows/component-test-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p01-component-encapsulation-v0.3.0
      - name: Apply minimal test corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/blender_components_test.py');s=p.read_text()
          old="        evaluated=list(bpy.context.evaluated_depsgraph_get().object_instances)\n        parts=[i for i in evaluated if i.is_instance and i.parent and i.parent.original==r]\n        assert len(parts)>=4, 'Instance source does not render through dependency graph'"
          new="        # Depsgraph iterator entries are ephemeral RNA wrappers, not persistent objects.\n        count=sum(1 for i in bpy.context.evaluated_depsgraph_get().object_instances\n                  if i.is_instance and i.parent and i.parent.original==r)\n        assert count>=4, 'Instance source does not render through dependency graph'"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          p=Path('scripts/blender_components_gui_test.py');s=p.read_text()
          s=s.replace('import json, os, sys, traceback','import json, os, sys, traceback, subprocess')
          old="            elif step==7:\n                bpy.ops.wm.save_as_mainfile"
          new="            elif step==7:\n                # Exercise the actual Object Mode keymap, not just operator invocation.\n                subprocess.run(['xdotool','mousemove',str(area.x+region.x+region.width//2),\n                                str(window.height-(area.y+region.y+region.height//2)),\n                                'key','Tab'],check=True)\n            elif step==8:\n                assert context.mode=='OBJECT' and context.scene.get('dbim_component_edit')=='door-01', (context.mode,context.scene.get('dbim_component_edit'))\n                state['checks'].append('OS keyboard Tab enters component')\n                subprocess.run(['xdotool','key','Tab'],check=True)\n            elif step==9:\n                assert context.mode=='OBJECT' and not context.scene.get('dbim_component_edit'), (context.mode,context.scene.get('dbim_component_edit'))\n                state['checks'].append('OS keyboard Tab exits without entering raw mesh edit')\n            elif step==10:\n                bpy.ops.wm.save_as_mainfile"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          PY
          test "$(git hash-object scripts/blender_components_test.py)" = f4b8d8de93800012ed31b99659c9dcafefa99327
          test "$(git hash-object scripts/blender_components_gui_test.py)" = f52336e063f8dae373f69d77d19f4aa26d807b28
      - name: Verify and commit test files only
        run: |
          python -m pip install 'pytest>=8,<9'
          python -m pytest -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/blender_components_test.py scripts/blender_components_gui_test.py
          git commit -m 'test: avoid stale RNA wrappers and verify real Tab events'
          git push origin HEAD:codex/p01-component-encapsulation-v0.3.0
